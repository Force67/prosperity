name: CI

on: [push, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore Nix store
      id: nix-cache
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-ci-${{ runner.os }}-${{ runner.arch }}-

    - name: Prepare CI shell
      run: nix develop .#ci --profile "$RUNNER_TEMP/nix-ci-profile" --command true

    # Save the toolchain before building, so failures still leave a warm cache.
    - name: Save Nix store
      if: steps.nix-cache.outputs.hit-primary-key != 'true'
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: ${{ steps.nix-cache.outputs.primary-key }}
        gc-max-store-size-linux: 5G

    - name: Restore ccache
      id: ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
          ccache-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure
      id: configure
      run: nix develop .#ci --command cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - name: Build
      run: nix develop .#ci --command cmake --build build --parallel "$(nproc)"

    - name: Save ccache
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    - name: Test
      run: nix develop .#ci --command ctest --test-dir build --output-on-failure
    - name: ccache stats
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      run: nix develop .#ci --command ccache -s

    - uses: actions/upload-artifact@v4
      with:
        name: ps4delta
        path: build/delta/main/ps4delta
